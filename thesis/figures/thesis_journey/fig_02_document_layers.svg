   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 114.679967)">Problem framing, scope, architecture,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 125.877779)">experiments, findings, limitations</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 137.075592)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 148.273404)">Best use: source material for thesis body chapters</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3a7d7c" x="123.91128" y="206.067219" transform="rotate(-0 123.91128 206.067219)">Layer B  Development history</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 218.463647)">Timeline, bugs, fixes, scope shifts,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 229.661459)">repo evolution</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 240.859272)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 252.057084)">Best use: supervision, appendix support, defense preparation</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c5a46d" x="123.91128" y="309.850899" transform="rotate(-0 123.91128 309.850899)">Layer C  Internal readiness</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 322.247327)">Completion estimates, time/risk planning,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 333.445139)">next actions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 344.642952)"/>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(127.66104 355.840764)">Best use: project management and execution only</text>
