   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 207.756458)">- Offline-first pipeline execution</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 218.95427)">- Single-machine reproducibility</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 230.152083)">- HAR classifier governance</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 241.349895)">- Label-free monitoring signals</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 252.547708)">- Conditional retraining branch</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 263.74552)">- Thesis-ready engineering evidence</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(60.21 274.943333)">- Wrist-based Garmin batch and file upload workflow</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="392.22" y="119.975552" transform="rotate(-0 392.22 119.975552)">Out of scope or intentionally reduced</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 207.756458)">- Full cloud deployment</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 218.95427)">- Kubernetes / cluster orchestration</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 230.152083)">- Clinically validated prognosis model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 241.349895)">- Fully automated trustworthy self-improving system</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 252.547708)">- Unrestricted auto-deploy of every new model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 263.74552)">- SOTA transformer benchmarking</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(395.01 274.943333)">- End-to-end streaming Garmin Connect production system</text>
   </g>
