    <text style="font-size: 9.2px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="44.028" y="341.731638" transform="rotate(-0 44.028 341.731638)">Fixed seed = 42. The scaler is fitted only on the training partition in each fold, which protects the validation estimate from leakage.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #1f2933" x="7.2" y="17.837812" transform="rotate(-0 7.2 17.837812)">Training workflow for the baseline model</text>
