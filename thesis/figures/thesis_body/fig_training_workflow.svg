   <g id="text_1">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b53" x="48.005424" y="109.656955" transform="rotate(-0 48.005424 109.656955)">Step 1</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(57.896525 121.457487)">Load labeled dataset</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(83.676994 132.655299)">and define</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(63.426994 143.853112)">grouped user-fold CV</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3a7d7c" x="232.145424" y="109.656955" transform="rotate(-0 232.145424 109.656955)">Step 2</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(252.247462 121.457487)">Within each fold:</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(241.234962 132.655299)">split train / validation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(248.149806 143.853112)">(10% callback set)</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #c5a46d" x="416.285424" y="109.656955" transform="rotate(-0 416.285424 109.656955)">Step 3</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(432.890587 121.457487)">Fit StandardScaler</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(445.389025 132.655299)">on train only,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(432.122619 143.853112)">then transform val</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52606d" x="599.541552" y="109.656955" transform="rotate(-0 599.541552 109.656955)">Step 4</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(615.443919 121.457487)">Window data</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(612.55095 132.655299)">(200 samples,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(614.57595 143.853112)">50% overlap)</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #243b53" x="174.104496" y="243.311708" transform="rotate(-0 174.104496 243.311708)">Step 5</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(191.35855 252.640149)">Train 1D-CNN + BiLSTM</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(223.6273 263.837961)">with Adam</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(208.816362 275.035774)">max 100 epochs</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(216.913237 286.233586)">batch size 64</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b85c38" x="402.438096" y="243.311708" transform="rotate(-0 402.438096 243.311708)">Step 6</text>
   </g>
   <g id="text_12">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(453.092931 252.640149)">Callbacks:</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(442.760119 263.837961)">early stopping</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(447.060119 275.035774)">LR reduction</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(427.478869 286.233586)">restore best weights</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 10.4px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #3a7d7c" x="599.541552" y="243.311708" transform="rotate(-0 599.541552 243.311708)">Step 7</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(605.230638 263.837961)">Store best model</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; fill: #1f2933" transform="translate(607.333763 275.035774)">and fold metrics</text>
   </g>
