[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41"]
build-backend = "setuptools.build_meta"

[project]
name = "har-mlops-pipeline"
version = "2.1.0"
description = "MLOps-Enhanced HAR Pipeline for Anxiety Detection Using Wearable Sensors"
authors = [{name = "Shalin Vachheta", email = "shalinvachheta2016@hotmail.com"}]
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
har-pipeline = "src.cli:main"

[tool.setuptools]
packages = {find = {include = ["src*"]}}

[tool.setuptools.dynamic]
dependencies = {file = "config/requirements.txt"}

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -ra"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests that require GPU",
    "robustness: marks robustness/noise injection tests",
    "calibration: marks calibration/uncertainty tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]
